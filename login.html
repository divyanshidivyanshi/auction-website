<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bid Wave</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="navbar">
      <div class="logo">
        <img style="width:195px;" src="logo.png" alt="Logo">
      </div>
      <nav>
        <ul>
          <li><a href="index.html">HOME</a></li>
          <li><a href="auction.html">AUCTIONS+</a></li>
          <li><a href="buy.html">BUY</a></li>
          <li><a href="sell.html">SELL</a></li>
          <li><a href="department.html">DEPARTMENTS</a></li>
          <li><a href="reach us.html">REACH US</a></li>
          <li><a href="login.html" class="link-bg">LOGIN/REGISTER</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="container">
    <!-- Login Form -->
    <div class="form-box" id="login-form">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="Enter your email" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" required>

        <button type="submit">Login</button>
      </form>
      <p id="loginMsg"></p>
      <div class="toggle-btn">
        <p>Don't have an account? <a href="javascript:void(0)" onclick="toggleForm()">Register</a></p>
      </div>
    </div>

    <!-- Register Form -->
    <div class="form-box" id="register-form" style="display: none;">
      <h2>Register</h2>
      <form id="registerForm">
        <label for="register-name">Full Name</label>
        <input type="text" id="register-name" placeholder="Enter your full name" required>

        <label for="register-email">Email</label>
        <input type="email" id="register-email" placeholder="Enter your email" required>

        <label for="register-password">Password</label>
        <input type="password" id="register-password" placeholder="Create a password" required>

        <label for="register-confirm-password">Confirm Password</label>
        <input type="password" id="register-confirm-password" placeholder="Confirm your password" required>

        <button type="submit">Register</button>
      </form>
      <p id="registerMsg"></p>
      <div class="toggle-btn">
        <p>Already have an account? <a href="javascript:void(0)" onclick="toggleForm()">Login</a></p>
      </div>
    </div>
  </div>

  <script>
    // Toggle between login and register
    function toggleForm() {
      const loginForm = document.getElementById("login-form");
      const registerForm = document.getElementById("register-form");
      if (loginForm.style.display === "none") {
        loginForm.style.display = "block";
        registerForm.style.display = "none";
      } else {
        loginForm.style.display = "none";
        registerForm.style.display = "block";
      }
    }

    // ✅ Login submit
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      try {
        const res = await fetch("http://localhost:3000/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok) {
          document.getElementById("loginMsg").innerText = "✅ Login successful!";
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));
          window.location.href = "home.html"; // redirect
        } else {
          document.getElementById("loginMsg").innerText = "❌ " + data.msg;
        }
      } catch (err) {
        document.getElementById("loginMsg").innerText = "⚠️ Server error, try again later.";
      }
    });

    // ✅ Register submit
    document.getElementById("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const name = document.getElementById("register-name").value;
      const email = document.getElementById("register-email").value;
      const password = document.getElementById("register-password").value;
      const confirmPassword = document.getElementById("register-confirm-password").value;

      if (password !== confirmPassword) {
        document.getElementById("registerMsg").innerText = "❌ Passwords do not match!";
        return;
      }

      try {
        const res = await fetch("http://localhost:3000/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        if (res.ok) {
          document.getElementById("registerMsg").innerText = "✅ Registration successful! Please login.";
          setTimeout(() => toggleForm(), 2000); // switch to login
        } else {
          document.getElementById("registerMsg").innerText = "❌ " + data.msg;
        }
      } catch (err) {
        document.getElementById("registerMsg").innerText = "⚠️ Server error, try again later.";
      }
    });
  </script>
</body>
</html>
