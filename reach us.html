<u><h1 style="font-size:50px;">Reach Us</h1></u>
<!-- Right Side: Contact Form -->
    <div class="contact-box">
      <h2>Contact Us</h2>
      <p>Thank you for showing interest in BidWave. We appreciate your inquiries and feedback. Please don't hesitate to reach out to us using the details provided below:</p>

      <form>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone">

        <label for="department">Choose Department</label>
        <select id="department" name="department">
          <option value="">-- Select Department --</option>
          <option value="Timepieces & Mordern Indian Arts">Timepieces & Mordern Indian Arts</option>
          <option value="Numismatic & Philately">Numismatic & Philately</option>
          <option value="Fine writing & Instruments">Fine writing & Instruments</option>
          <option value="Jewellery & Silverware">Jewellery & Silverware</option>
          <option value="Indian Antiques">Indian Antiques</option>
          <option value="Classic & Vintage Automobiles">Classic & Vintage Automobiles</option>
          <option value="others">Others</option>
        </select>

        <label for="query">Type your query here</label>
        <textarea id="query" name="query" required></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
   </div>
  </div> <!-- End of .container -->

  <script>
  document.getElementById('contact-form').addEventListener('submit', async function (e) {
    e.preventDefault();

    const formData = {
      fullname: document.getElementById('fullname').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      department: document.getElementById('department').value,
      query: document.getElementById('query').value
    };

    try {
      const response = await fetch('http://localhost:3000/api/contact', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
      });

      if (response.ok) {
        alert('Thank you! Your query has been submitted.');
        document.getElementById('contact-form').reset();
      } else {
        alert('Submission failed.');
      }
    } catch (error) {
      console.error('Error:', error);
      alert('Could not send your message.');
    }
  });
</script>
